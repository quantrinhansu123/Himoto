name: Identity QR checks
on:
  pull_request:
    paths:
      - 'package*.json'
      - 'src/lib/management/identity-qr.ts'
      - 'src/lib/management/photo-ocr.ts'
      - 'src/components/management/IdentityQrCamera.tsx'
      - 'src/components/management/usePhotoOcr.ts'
      - 'src/components/management/CustomerDocumentBatch.tsx'
      - 'src/components/contracts/CustomerCreateDialog.tsx'
      - 'src/components/contracts/ContractComposer.tsx'
      - 'public/vendor/zxing/**'
      - 'scripts/*identity-qr*'
      - 'scripts/fixtures/identity-qr/**'
      - 'scripts/requirements-mobile-qa.txt'
      - '.github/workflows/identity-qr-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:identity-qr
      - run: npm run build
      - name: Prepare browser runtime
        run: |
          python3 -m venv .backups/identity-qr-qa
          .backups/identity-qr-qa/bin/pip install -r scripts/requirements-mobile-qa.txt
          .backups/identity-qr-qa/bin/python -m playwright install --with-deps chromium
      - name: Check local QR decoding and camera lifecycle
        run: |
          node node_modules/next/dist/bin/next dev scripts/fixtures/identity-qr -H 127.0.0.1 -p 3097 > /tmp/identity-qr-ui.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3097/ > /dev/null; then break; fi
            sleep 1
          done
          .backups/identity-qr-qa/bin/python scripts/check-identity-qr-ui.py --output .backups/identity-qr-browser
      - name: Preserve synthetic acceptance results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: identity-qr-browser
          path: .backups/identity-qr-browser/
          retention-days: 7
