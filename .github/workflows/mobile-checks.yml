  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPO_NO_DOTENV: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:release
      - run: npm run test:login
      - run: mkdir -p .backups
      - run: npm run test:mobile
      - run: python3 scripts/check-mobile-native-diagnostics.py
      - run: python3 scripts/check-mobile-native-keyboard.py
      - run: python3 scripts/check-mobile-native-target.py
      - run: node scripts/check-mobile-contract-import-backup.cjs
      - run: node scripts/check-mobile-telegram-api.cjs
      - run: python3 scripts/check-mobile-transfer-fixture.py
      - run: python3 scripts/check-mobile-recovery-fixture.py
      - run: python3 scripts/check-mobile-contract-flow-fixture.py
      - run: python3 scripts/check-mobile-customer-matches-fixture.py
      - run: python3 scripts/check-mobile-gps-fixture.py
      - name: Execute mobile financial, bill and renewal SQL in isolated PostgreSQL
        run: |
          npm install --prefix .backups/mobile-sql-qa --no-save --package-lock=false --ignore-scripts @electric-sql/pglite@0.5.14
          node scripts/check-mobile-web-merge.cjs --suite attendance --pglite-path .backups/mobile-sql-qa/node_modules/@electric-sql/pglite
          node scripts/check-mobile-web-merge.cjs --suite contract-value-sales --pglite-path .backups/mobile-sql-qa/node_modules/@electric-sql/pglite
          npm run test:mobile:sql -- --pglite-path .backups/mobile-sql-qa/node_modules/@electric-sql/pglite
          node scripts/check-mobile-customer-matches.cjs --pglite-path .backups/mobile-sql-qa/node_modules/@electric-sql/pglite
          node scripts/check-mobile-customer-documents.cjs --pglite-path .backups/mobile-sql-qa/node_modules/@electric-sql/pglite
          node scripts/check-mobile-contract-photos.cjs --pglite-path .backups/mobile-sql-qa/node_modules/@electric-sql/pglite
          node scripts/check-mobile-customer-photo-copy.cjs --pglite-path .backups/mobile-sql-qa/node_modules/@electric-sql/pglite
          node scripts/check-mobile-media-delete.cjs --pglite-path .backups/mobile-sql-qa/node_modules/@electric-sql/pglite
          node scripts/check-mobile-record-video.cjs --pglite-path .backups/mobile-sql-qa/node_modules/@electric-sql/pglite --history
          node scripts/check-mobile-direct-video.cjs
          node scripts/check-mobile-gps.cjs --pglite-path .backups/mobile-sql-qa/node_modules/@electric-sql/pglite
          node scripts/check-mobile-session-transition.cjs --pglite-path .backups/mobile-sql-qa/node_modules/@electric-sql/pglite
          node scripts/check-mobile-duty-roster.cjs --pglite-path .backups/mobile-sql-qa/node_modules/@electric-sql/pglite
          node scripts/check-mobile-vehicles.cjs --pglite-path .backups/mobile-sql-qa/node_modules/@electric-sql/pglite
          node scripts/check-mobile-stores.cjs --pglite-path .backups/mobile-sql-qa/node_modules/@electric-sql/pglite
          node scripts/check-mobile-staff.cjs --pglite-path .backups/mobile-sql-qa/node_modules/@electric-sql/pglite
          node scripts/check-mobile-cashbook.cjs --pglite-path .backups/mobile-sql-qa/node_modules/@electric-sql/pglite
          node scripts/check-mobile-reports.cjs --pglite-path .backups/mobile-sql-qa/node_modules/@electric-sql/pglite
          node scripts/check-mobile-debt-reminders.cjs --pglite-path .backups/mobile-sql-qa/node_modules/@electric-sql/pglite
          node scripts/check-mobile-shift-reports.cjs --pglite-path .backups/mobile-sql-qa/node_modules/@electric-sql/pglite
          node scripts/check-mobile-battery.cjs --pglite-path .backups/mobile-sql-qa/node_modules/@electric-sql/pglite
          node scripts/check-mobile-contract-types.cjs --pglite-path .backups/mobile-sql-qa/node_modules/@electric-sql/pglite
          node scripts/check-mobile-managed-accounts.cjs --pglite-path .backups/mobile-sql-qa/node_modules/@electric-sql/pglite
          node scripts/check-mobile-integrations.cjs --pglite-path .backups/mobile-sql-qa/node_modules/@electric-sql/pglite
          node scripts/check-mobile-operations.cjs --pglite-path .backups/mobile-sql-qa/node_modules/@electric-sql/pglite
          node scripts/check-mobile-backfill.cjs
          node scripts/check-mobile-renewal-parity.cjs
