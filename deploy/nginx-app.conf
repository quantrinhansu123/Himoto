server {
    listen 80;
    listen [::]:80;
    server_name app.himoto.vn;
    return 301 https://app.himoto.vn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.himoto.vn;
    ssl_certificate /etc/ssl/cloudflare/himoto.vn.pem;
    ssl_certificate_key /etc/ssl/cloudflare/himoto.vn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100M;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    include snippets/himoto-protect-files.conf;
    location ~ \.php(?:/|$) { return 404; }
    location = /car-rental { return 302 /contracts; }
    location /storage/ {
        alias /var/www/app.himoto.vn/storage/app/public/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        include snippets/himoto-next-upstream.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
    }
}
